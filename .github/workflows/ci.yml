name: CI

on:
  push:
    branches: [main, docs-hardening]
  pull_request:

jobs:
  ci:
    name: lint + parse + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax check all shell scripts)
        run: |
          set -e
          status=0
          for f in $(git ls-files '*.sh'); do
            if bash -n "$f"; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              status=1
            fi
          done
          exit $status

      - name: shellcheck (static analysis of shell scripts)
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          shellcheck -x $(git ls-files '*.sh')

      - name: PowerShell syntax check (Parser::ParseFile)
        shell: pwsh
        run: |
          $failed = 0
          foreach ($f in (git ls-files '*.ps1')) {
            $tokens = $null
            $errors = $null
            $path = Join-Path (Get-Location) $f
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed++
              Write-Output "FAIL: $f"
              $errors | ForEach-Object { Write-Output "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Output "OK: $f"
            }
          }
          exit $failed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: py_compile (all Python files)
        run: python -m py_compile $(git ls-files '*.py')

      - name: pytest (torch-free unit tests)
        run: |
          python -m pip install --quiet --upgrade pip pytest
          python -m pytest tests/test_deployment.py tests/test_warmup_profile.py -v
